name: Publish site to gh-pages

# Источник GitHub Pages для этого репозитория - ветка gh-pages.
# Workflow держит её в синхроне с master: собирает содержимое сайта
# без служебных файлов и перезаписывает ветку.
#
# Вариант с actions/deploy-pages здесь не работает: у токена Actions
# нет права создавать сайт Pages, первый запуск падал на
# «Resource not accessible by integration».

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать содержимое сайта
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r index.html assets data README.md "$RUNNER_TEMP/site/"
          # Без .nojekyll Jekyll выкусывает файлы и папки, начинающиеся с подчёркивания.
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Опубликовать в gh-pages
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Публикация сайта из ${GITHUB_SHA:0:7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
