<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашняя библиотека</title>
<meta name="description" content="Каталог домашней библиотеки: поиск, жанры, карта полок.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="header-row">
      <div class="brand">
        <h1>Домашняя библиотека</h1>
        <span class="count" id="found">0</span>
      </div>

      <div class="search">
        <span class="icon" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </span>
        <input id="q" type="search" placeholder="Название, автор, жанр, издательство…" autocomplete="off" aria-label="Поиск по библиотеке">
        <kbd>/</kbd>
      </div>

      <div class="segmented" role="group" aria-label="Вид">
        <button data-view="wall" aria-pressed="true">Стеллаж</button>
        <button data-view="grid" aria-pressed="false">Обложки</button>
        <button data-view="shelf" aria-pressed="false">Полка</button>
        <button data-view="list" aria-pressed="false">Список</button>
      </div>

      <button class="icon-btn" id="export" title="Выгрузить CSV">CSV</button>
      <button class="icon-btn" id="theme" title="Светлая / тёмная тема" aria-label="Переключить тему">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>

    <div class="filters">
      <div class="chips" id="genres"></div>
      <div class="selects">
        <select id="f-lang" aria-label="Язык"><option value="">Все языки</option></select>
        <select id="f-status" aria-label="Статус">
          <option value="">Любой статус</option>
          <option value="read">Прочитана</option>
          <option value="reading">Читаю</option>
          <option value="unread">Не читана</option>
        </select>
        <select id="f-sort" aria-label="Сортировка">
          <option value="author">По автору</option>
          <option value="title">По названию</option>
          <option value="year">По году</option>
          <option value="rating">По оценке</option>
          <option value="shelf">По ячейке</option>
          <option value="added">По дате добавления</option>
        </select>
        <button class="chip chip-warn" id="verify" aria-pressed="false" hidden></button>
        <span class="cell-note" id="cell-note" hidden></span>
        <button class="reset" id="reset" hidden>Сбросить</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div id="library"></div>

  <footer>
    <span>Секции 1-4 слева направо, полки 1-6 сверху вниз.</span>
    <span>Нажми <kbd>/</kbd> для поиска.</span>
    <span>Клик по ячейке в виде «Стеллаж» - показать её содержимое.</span>
  </footer>
</main>

<dialog id="detail" aria-label="Карточка книги"><div class="sheet"></div></dialog>

<script src="data/cells.js"></script>
<script src="data/books.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
